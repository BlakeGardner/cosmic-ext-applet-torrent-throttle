# cargo-deny configuration — checked in CI (see .github/workflows/ci.yml)
# and weekly by .github/workflows/audit.yml.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # quick-xml < 0.41 DoS advisories. quick-xml is pinned by
    # wayland-scanner, a build-time proc-macro that parses trusted Wayland
    # protocol XML during compilation — the parser never runs at runtime or
    # on untrusted input.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # Unmaintained transitive dependencies of the libcosmic/iced tree; we
    # have no control over them here. Revisit when libcosmic updates.
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0173", # proc-macro-error2
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0206", # rustybuzz
]

[licenses]
version = 2
# Licenses acceptable for this GPL-3.0-or-later binary's dependencies.
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

# Git dependencies whose manifests lack a `license` field; expressions below
# were verified against the LICENSE files in each repository.
[[licenses.clarify]]
crate = "cosmic-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-config-derive"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-theme"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "iced_accessibility"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-settings-daemon"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-panel-config"
expression = "GPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "xdg-shell-wrapper-config"
expression = "GPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "dnd"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "mime"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/jackpot51/rust-atomicwrites",
]

[sources.allow-org]
github = ["pop-os", "wash2", "iced-rs"]
